[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "repo-doping-detection"
version         = "0.1.0"
description     = "Deep learning pipeline for rEPO doping detection from peripheral blood smear WSIs"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
dependencies    = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "openslide-python>=1.3.0",
    "mlflow>=2.8.0",
    "optuna>=3.3.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "nvidia-ml-py>=12.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/Ai-in-Cancer-org/rEPO_doping_detection"
Haemorasis = "https://github.com/josegcpa/haemorasis"
